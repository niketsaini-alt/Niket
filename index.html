<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Quick Question</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #ffe6ea;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.15);
      max-width: 400px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .meme-box {
      width: 100%;
      height: 190px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      overflow: hidden;
      border-radius: 14px;
    }

    .meme-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    h1 {
      font-size: 22px;
      color: #333;
      margin-bottom: 25px;
      line-height: 1.3;
    }

    .buttons {
      position: relative;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
      z-index: 2;
    }

    #noBtn {
      background-color: #adb5bd;
      color: white;
      user-select: none;
      -webkit-user-select: none;
      z-index: 999;
      transition: left 0.2s ease, top 0.2s ease;
    }

    #dateTimeSection {
      display: none;
      margin-top: 15px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 14px;
      font-weight: bold;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 11px;
      border: 1.5px solid #ffccd5;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input[type="date"]:focus,
    input[type="time"]:focus {
      border-color: #ff4d6d;
    }

    #confirmBtn {
      background-color: #ff4d6d;
      color: white;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
    }

    #finalMessage {
      display: none;
      font-size: 17px;
      color: #333;
      margin-top: 15px;
      line-height: 1.5;
    }

    .whatsapp-btn {
      display: inline-block;
      margin-top: 15px;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="meme-box">
      <!-- Starting cute asking bear -->
      <img id="displayMeme" src="https://media.tenor.com/efbLATQZqWAAAAAi/milk-and-mocha-bear-couple.gif" alt="Cute Bear" />
    </div>

    <h1 id="question">Will you go on a date with Niket Singh Saini?</h1>

    <div class="buttons" id="btnGroup">
      <button id="yesBtn" onclick="acceptDate()">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div id="dateTimeSection">
      <h2 style="color: #ff4d6d; margin-bottom: 15px; font-size: 20px;">Pick a date and time:</h2>
      
      <div class="form-group">
        <label for="dateInput">Select Date:</label>
        <input type="date" id="dateInput" />
      </div>

      <div class="form-group">
        <label for="timeInput">Select Time:</label>
        <input type="time" id="timeInput" />
      </div>

      <button id="confirmBtn" onclick="saveDateTime()">Confirm</button>
    </div>

    <div id="finalMessage">
      <p id="detailsText" style="font-weight: bold; margin-bottom: 10px;"></p>
      <a id="waLink" class="whatsapp-btn" href="javascript:void(0)" onclick="openWhatsApp()">Send details on WhatsApp</a>
    </div>
  </div>

  <script>
    // 1. Prevent past dates
    const dateInput = document.getElementById('dateInput');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;

    // 2. Cute sad GIFs when she tries to tap 'No'
    const sadGifs = [
      "https://media.tenor.com/BDu-e0K8vYQAAAAi/milk-and-mocha-sad.gif",
      "https://media.tenor.com/n6YlFj5K6F0AAAAi/mocha-crying-milk-and-mocha.gif",
      "https://media.tenor.com/V9r9T3K4vH0AAAAi/milk-and-mocha-bears.gif"
    ];

    let sadIndex = 0;
    const noBtn = document.getElementById('noBtn');
    const displayMeme = document.getElementById('displayMeme');

    // 3. Move button safely inside the visible screen without disappearing
    function moveButton(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      
      // Calculate exact safe boundaries inside screen
      const btnRect = noBtn.getBoundingClientRect();
      const btnWidth = btnRect.width || 80;
      const btnHeight = btnRect.height || 40;

      const safeMargin = 25;
      const minX = safeMargin;
      const maxX = window.innerWidth - btnWidth - safeMargin;
      const minY = safeMargin;
      const maxY = window.innerHeight - btnHeight - safeMargin;

      // Ensure valid numbers
      const finalMaxX = Math.max(minX, maxX);
      const finalMaxY = Math.max(minY, maxY);

      const randomX = Math.floor(Math.random() * (finalMaxX - minX + 1)) + minX;
      const randomY = Math.floor(Math.random() * (finalMaxY - minY + 1)) + minY;

      noBtn.style.position = 'fixed';
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';

      // Switch GIF to sad bear
      displayMeme.src = sadGifs[sadIndex % sadGifs.length];
      sadIndex++;
    }

    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('touchstart', moveButton, { passive: false });
    noBtn.addEventListener('pointerdown', moveButton);
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveButton(e);
    });

    // 4. Accept Action
    function acceptDate() {
      document.getElementById('question').style.display = 'none';
      document.getElementById('btnGroup').style.display = 'none';
      noBtn.style.display = 'none'; // Only hide after Yes is clicked
      
      // Happy bear celebration GIF
      displayMeme.src = "https://media.tenor.com/T0d-McrqS3cAAAAi/milk-and-mocha-happy.gif";
      document.getElementById('dateTimeSection').style.display = 'block';
    }

    let globalWaUrl = '';
    let globalWaAppUrl = '';

    // 5. Save Details
    function saveDateTime() {
      const dateVal = document.getElementById('dateInput').value;
      const timeVal = document.getElementById('timeInput').value;

      if (!dateVal || !timeVal) {
        alert('Please pick both date and time!');
        return;
      }

      document.getElementById('dateTimeSection').style.display = 'none';
      
      // Cute cuddle bear GIF
      displayMeme.src = "https://media.tenor.com/4q-vWbQ99jAAAAAi/milk-and-mocha-hug.gif";
      
      const details = `See you on ${dateVal} at ${timeVal}!`;
      document.getElementById('detailsText').innerText = details;

      const myPhoneNumber = "917206490090";
      const rawText = `Hey Niket Singh Saini! I said yes! Let's go out on ${dateVal} at ${timeVal}.`;
      const encodedMessage = encodeURIComponent(rawText);
      
      globalWaAppUrl = `whatsapp://send?phone=${myPhoneNumber}&text=${encodedMessage}`;
      globalWaUrl = `https://api.whatsapp.com/send?phone=${myPhoneNumber}&text=${encodedMessage}`;

      document.getElementById('finalMessage').style.display = 'block';
    }

    // 6. WhatsApp Redirection
    function openWhatsApp() {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      
      if (isMobile) {
        window.location.href = globalWaAppUrl;
        setTimeout(() => {
          window.location.href = globalWaUrl;
        }, 800);
      } else {
        window.open(globalWaUrl, '_blank');
      }
    }
  </script>

</body>
</html>
