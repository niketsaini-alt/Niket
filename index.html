<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>A Quick Question</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #ffe6ea;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.15);
      max-width: 380px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .meme-box {
      width: 100%;
      height: 190px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      border-radius: 14px;
      background: #fff0f3;
      overflow: hidden;
    }

    .meme-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    h1 {
      font-size: 20px;
      color: #333333;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .buttons {
      position: relative;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
      z-index: 2;
    }

    #noBtn {
      background-color: #adb5bd;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      z-index: 999;
      transition: left 0.18s ease, top 0.18s ease;
    }

    #dateTimeSection {
      display: none;
      margin-top: 15px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #555555;
      font-size: 14px;
      font-weight: bold;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 11px;
      border: 1.5px solid #ffccd5;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    #confirmBtn {
      background-color: #ff4d6d;
      color: #ffffff;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
    }

    #finalMessage {
      display: none;
      font-size: 16px;
      color: #333333;
      margin-top: 15px;
      line-height: 1.5;
    }

    .whatsapp-btn {
      display: inline-block;
      margin-top: 15px;
      background-color: #25d366;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="meme-box">
      <!-- 100% Unblockable Cute Asking Bear (GitHub Raw CDN) -->
      <img id="displayMeme" src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Cute Kitten" />
    </div>

    <h1 id="question">Will you go on a date with Niket Singh Saini?</h1>

    <div class="buttons" id="btnGroup">
      <button id="yesBtn" onclick="acceptDate()">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div id="dateTimeSection">
      <h2 style="color: #ff4d6d; margin-bottom: 15px; font-size: 19px;">Pick a date and time:</h2>
      
      <div class="form-group">
        <label for="dateInput">Select Date:</label>
        <input type="date" id="dateInput" />
      </div>

      <div class="form-group">
        <label for="timeInput">Select Time:</label>
        <input type="time" id="timeInput" />
      </div>

      <button id="confirmBtn" onclick="saveDateTime()">Confirm</button>
    </div>

    <div id="finalMessage">
      <p id="detailsText" style="font-weight: bold; margin-bottom: 10px;"></p>
      <a id="waLink" class="whatsapp-btn" href="javascript:void(0)" onclick="openWhatsApp()">Send details on WhatsApp</a>
    </div>
  </div>

  <script>
    // 1. Past dates blocked
    const dateInput = document.getElementById('dateInput');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;

    // 2. High-reliability cute reaction GIFs
    const sadGifs = [
      "https://media.tenor.com/BDu-e0K8vYQAAAAi/milk-and-mocha-sad.gif",
      "https://media.tenor.com/n6YlFj5K6F0AAAAi/mocha-crying-milk-and-mocha.gif"
    ];

    let sadIndex = 0;
    const noBtn = document.getElementById('noBtn');
    const displayMeme = document.getElementById('displayMeme');

    function moveButton(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      
      const btnRect = noBtn.getBoundingClientRect();
      const btnWidth = btnRect.width || 80;
      const btnHeight = btnRect.height || 40;

      const safeMargin = 20;
      const minX = safeMargin;
      const maxX = window.innerWidth - btnWidth - safeMargin;
      const minY = safeMargin;
      const maxY = window.innerHeight - btnHeight - safeMargin;

      const randomX = Math.floor(Math.random() * (Math.max(minX, maxX) - minX + 1)) + minX;
      const randomY = Math.floor(Math.random() * (Math.max(minY, maxY) - minY + 1)) + minY;

      noBtn.style.position = 'fixed';
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';

      displayMeme.src = sadGifs[sadIndex % sadGifs.length];
      sadIndex++;
    }

    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('touchstart', moveButton, { passive: false });
    noBtn.addEventListener('pointerdown', moveButton);
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveButton(e);
    });

    // 3. Accepted -> Super cute bear kiss GIF
    function acceptDate() {
      document.getElementById('question').style.display = 'none';
      document.getElementById('btnGroup').style.display = 'none';
      noBtn.style.display = 'none';
      
      displayMeme.src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif";
      document.getElementById('dateTimeSection').style.display = 'block';
    }

    let globalWaUrl = '';
    let globalWaAppUrl = '';

    // 4. Save Details -> Happy cuddles
    function saveDateTime() {
      const dateVal = document.getElementById('dateInput').value;
      const timeVal = document.getElementById('timeInput').value;

      if (!dateVal || !timeVal) {
        alert('Please pick both date and time!');
        return;
      }

      document.getElementById('dateTimeSection').style.display = 'none';
      displayMeme.src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif";
      
      const details = `See you on ${dateVal} at ${timeVal}!`;
      document.getElementById('detailsText').innerText = details;

      const myPhoneNumber = "917206490090";
      const rawText = `Hey Niket Singh Saini! I said yes! Let's go out on ${dateVal} at ${timeVal}.`;
      const encodedMessage = encodeURIComponent(rawText);
      
      globalWaAppUrl = `whatsapp://send?phone=${myPhoneNumber}&text=${encodedMessage}`;
      globalWaUrl = `https://api.whatsapp.com/send?phone=${myPhoneNumber}&text=${encodedMessage}`;

      document.getElementById('finalMessage').style.display = 'block';
    }

    // 5. WhatsApp Redirection
    function openWhatsApp() {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile) {
        window.location.href = globalWaAppUrl;
        setTimeout(() => {
          window.location.href = globalWaUrl;
        }, 800);
      } else {
        window.open(globalWaUrl, '_blank');
      }
    }
  </script>

</body>
</html>
